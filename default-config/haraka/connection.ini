[main]

; Haraka 3.3 moved connection-level settings out of smtp.ini and the
; legacy single-value config files into connection.ini.

; Require strict RFC 1869 envelope syntax.
; strict_rfc1869=false

; Allow relaxed envelope parsing.
; postel=false

; Advertise SMTPUTF8 support.
smtputf8=true

[haproxy]
; The legacy deployment publishes Haraka directly on port 25, so PROXY
; protocol parsing must remain disabled.
enabled=false

[headers]
add_received=true
clean_auth_results=true
show_version=true
max_lines=1000
max_received=100

[max]
bytes=26214400
mime_parts=1000
line_length=512
data_line_length=992

[message]
helo=Haraka is at your service.
close=closing connection. Have a jolly good day.

[uuid]
banner_chars=6
deny_chars=0
