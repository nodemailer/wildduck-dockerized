---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kirin-to-rspamd
  labels:
    app.kubernetes.io/name: rspamd
    app.kubernetes.io/part-of: wildduck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rspamd
      app.kubernetes.io/component: spam-filter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
