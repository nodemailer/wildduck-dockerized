---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wildduck-to-mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: wildduck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongo
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - wildduck
                  - wildduck-webmail
                  - zonemta
                  - kirin
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongo
      ports:
        - port: 27017
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wildduck-to-redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: wildduck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - wildduck
                  - wildduck-webmail
                  - zonemta
                  - kirin
                  - rspamd
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-acme-solver
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: wildduck
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8089
          protocol: TCP
