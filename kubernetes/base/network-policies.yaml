---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-kirin
  labels:
    app.kubernetes.io/name: kirin
    app.kubernetes.io/part-of: wildduck
spec:
  podSelector:
