apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/name: wildduck
    app.kubernetes.io/part-of: wildduck
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-wildduck
  labels:
    app.kubernetes.io/name: wildduck
    app.kubernetes.io/part-of: wildduck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wildduck
      app.kubernetes.io/component: mail-store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 1143
          protocol: TCP
        - port: 1110
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wildduck-webmail
              app.kubernetes.io/component: webmail
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-to-webmail
  labels:
    app.kubernetes.io/name: wildduck-webmail
    app.kubernetes.io/part-of: wildduck
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wildduck-webmail
      app.kubernetes.io/component: webmail
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 3000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
