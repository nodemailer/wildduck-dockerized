apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wildduck
  labels:
    app.kubernetes.io/name: wildduck
    app.kubernetes.io/part-of: wildduck
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wildduck
      app.kubernetes.io/component: mail-store
