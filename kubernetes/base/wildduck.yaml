apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildduck
  labels:
    app.kubernetes.io/name: wildduck
    app.kubernetes.io/component: mail-store
    app.kubernetes.io/part-of: wildduck
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: wildduck
      app.kubernetes.io/component: mail-store
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wildduck
        app.kubernetes.io/component: mail-store
        app.kubernetes.io/part-of: wildduck
    spec:
      serviceAccountName: wildduck
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: wildduck
              app.kubernetes.io/component: mail-store
      containers:
        - name: wildduck
          image: ghcr.io/zone-eu/wildduck:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: imap
              containerPort: 1143
              protocol: TCP
            - name: pop3
              containerPort: 1110
              protocol: TCP
          env:
            - name: APPCONF_dbs_mongo
              valueFrom:
                secretKeyRef:
                  name: wildduck-secrets
                  key: WILDDUCK_MONGO_URL
            - name: APPCONF_dbs_redis
              valueFrom:
                secretKeyRef:
                  name: wildduck-secrets
                  key: WILDDUCK_REDIS_URL
            - name: APPCONF_dbs_sender
              value: zone-mta
            - name: APPCONF_processes
              value: "1"
            - name: APPCONF_api_host
              value: 0.0.0.0
            - name: APPCONF_api_port
              value: "8080"
            - name: APPCONF_api_accessToken
              valueFrom:
                secretKeyRef:
                  name: wildduck-secrets
                  key: WILDDUCK_API_ACCESS_TOKEN
            - name: APPCONF_api_accessControl_secret
              valueFrom:
                secretKeyRef:
                  name: wildduck-secrets
                  key: WILDDUCK_API_ACCESSCONTROL_SECRET
            - name: APPCONF_api_metrics_enabled
              value: "true"
            - name: APPCONF_emailDomain
              valueFrom:
                configMapKeyRef:
                  name: wildduck-config
                  key: MAIL_DOMAIN
            - name: APPCONF_webauthn_rpId
              valueFrom:
                configMapKeyRef:
                  name: wildduck-config
                  key: PUBLIC_HOSTNAME
            - name: APPCONF_totp_secret
              valueFrom:
                secretKeyRef:
                  name: wildduck-secrets
                  key: WILDDUCK_TOTP_SECRET
            - name: APPCONF_imap_useProxy
              value: "true"
            - name: APPCONF_imap_port
              value: "1143"
            - name: APPCONF_imap_secure
              value: "false"
            - name: APPCONF_imap_disableSTARTTLS
              value: "true"
            - name: APPCONF_imap_setup_hostname
              valueFrom:
                configMapKeyRef:
                  name: wildduck-config
                  key: PUBLIC_HOSTNAME
            - name: APPCONF_imap_setup_port
              value: "993"
            - name: APPCONF_imap_setup_secure
              value: "true"
            - name: APPCONF_pop3_useProxy
              value: "true"
            - name: APPCONF_pop3_port
              value: "1110"
            - name: APPCONF_pop3_secure
              value: "false"
            - name: APPCONF_pop3_disableSTARTTLS
              value: "true"
            - name: APPCONF_pop3_ignoreSTARTTLS
              value: "true"
            - name: APPCONF_pop3_setup_hostname
              valueFrom:
                configMapKeyRef:
                  name: wildduck-config
                  key: PUBLIC_HOSTNAME
            - name: APPCONF_pop3_setup_port
              value: "995"
            - name: APPCONF_pop3_setup_secure
              value: "true"
            - name: APPCONF_smtp_setup_hostname
              valueFrom:
                configMapKeyRef:
                  name: wildduck-config
                  key: PUBLIC_HOSTNAME
            - name: APPCONF_smtp_setup_port
              value: "465"
            - name: APPCONF_smtp_setup_secure
              value: "true"
            - name: APPCONF_sender_loopSecret
              valueFrom:
                secretKeyRef:
                  name: wildduck-secrets
                  key: WILDDUCK_LOOP_SECRET
            - name: APPCONF_dkim_secret
              valueFrom:
                secretKeyRef:
                  name: wildduck-secrets
                  key: WILDDUCK_DKIM_SECRET
            - name: APPCONF_log_level
              value: info
          startupProbe:
            tcpSocket:
              port: api
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - >-
                  const http = require('http');
                  const r = http.get({host:'127.0.0.1',port:8080,path:'/users?limit=1',headers:{'X-Access-Token':process.env.APPCONF_api_accessToken}},
                  res => {res.resume();process.exit(res.statusCode === 200 ? 0 : 1)});
                  r.setTimeout(4000,()=>{r.destroy();process.exit(1)});
                  r.on('error',()=>process.exit(1));
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wildduck
  labels:
    app.kubernetes.io/name: wildduck
    app.kubernetes.io/component: mail-store
    app.kubernetes.io/part-of: wildduck
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wildduck
    app.kubernetes.io/component: mail-store
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: imap
      port: 143
      targetPort: imap
      protocol: TCP
    - name: pop3
      port: 110
      targetPort: pop3
      protocol: TCP
